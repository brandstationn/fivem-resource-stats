name: Collect stats

on:
  schedule:
    - cron: "4 * * * *"   # every hour at :04 (GitHub can start scheduled runs a few minutes late)
  workflow_dispatch:       # "Run workflow" button in the Actions tab

permissions:
  contents: write   # only used by the keep-alive step
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect server list and build site + API
        run: node collector/collect.mjs
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled workflows in repos with no commits for 60 days.
      # This adds an empty commit once a month so the hourly updates never stop.
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep hourly schedule active"
            git push
          fi
