name: Collect stats

# Runs every hour. GitHub's own scheduler is best-effort (runs can be late or skipped),
# so each run also queues the next one; that run waits until 5 minutes past the next hour.
# The schedule below stays as a backup that restarts the chain if it ever breaks.
on:
  schedule:
    - cron: "4 * * * *"
  workflow_dispatch:
    inputs:
      lookup_minutes:
        description: "Minutes to spend looking up resource lists"
        default: "45"
      chained:
        description: "Wait for the next hour before starting (set by the previous run)"
        default: "false"

permissions:
  contents: write   # keep-alive commit
  pages: write
  id-token: write
  actions: write    # queue the next run

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Queue the next hourly run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml -R "${{ github.repository }}" -f chained=true

      - name: Wait until 5 minutes past the hour
        if: inputs.chained == 'true'
        run: |
          now=$(date +%s); hour=$(( now / 3600 * 3600 ))
          target=$(( hour + 300 )); [ $now -ge $(( hour + 1200 )) ] && target=$(( hour + 3600 + 300 ))
          if [ $target -gt $now ]; then echo "waiting $(( target - now ))s"; sleep $(( target - now )); fi

  collect:
    needs: wait
    runs-on: ubuntu-latest
    timeout-minutes: 58
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build website
        working-directory: web
        run: npm ci && npm run build

      - name: Collect server list and build site + API
        run: node collector/collect.mjs
        env:
          LOOKUP_MINUTES: ${{ inputs.lookup_minutes || '45' }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Site size (GitHub Pages limit is 1 GB)
        run: du -sh dist dist/api/* | sort -h | tail -8

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled workflows in repos with no commits for 60 days.
      # This adds an empty commit once a month so the backup schedule never stops.
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep hourly schedule active"
            git push
          fi
