<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FiveM Resource Stats - servers & players per resource</title>
<meta name="description" content="Free, hourly-updated stats on how many FiveM servers run each resource and how many players are on them. Open JSON API.">
<link rel="preload" href="api/summary.json" as="fetch" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 1l7 13H1z%22 fill=%22%233987e5%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a href="#/" class="brand"><span class="logo">▲</span> FiveM Resource Stats</a>
  <nav><a href="#/">Resources</a><a href="#/api">API</a><a href="https://github.com/brandstationn/fivem-resource-stats" target="_blank" rel="noopener">GitHub</a></nav>
</header>

<div class="searchbar">
  <input id="q" type="search" placeholder="Search any resource, e.g. ox_lib, qb-core, casino…" autocomplete="off" spellcheck="false" aria-label="Search resources">
  <ul id="suggest" class="suggest" hidden></ul>
</div>

<main id="view"><p class="muted">Loading…</p></main>

<footer>
  Data from the public Cfx.re server list, refreshed every hour. Counts include only servers that publish their resource list.
  Not affiliated with Cfx.re. <span id="updated"></span>
</footer>
<script src="app.js" defer></script>
</body>
</html>
